id: api-change
name: API change
description: The request, the response before and after, and the compatibility question.
use_when: The change alters HTTP routes, handlers, or response shapes.
beats:
  - id: context
    eyebrow: API change
    eyebrows: { ko: 'API 변경', ja: 'API の変更', zh: 'API 变更' }
    goal: Name the endpoint and what changed about it.
    visuals: [title]
    expression: explaining
  - id: exchange
    eyebrow: Request / response
    eyebrows: { ko: '요청 / 응답', ja: 'リクエスト / レスポンス', zh: '请求 / 响应' }
    goal: Show the real response before and after the change.
    visuals: [api, code]
    expression: explaining
  - id: implementation
    eyebrow: Handler
    eyebrows: { ko: '핸들러', ja: 'ハンドラー', zh: '处理程序' }
    goal: The handler lines that produce the new behavior.
    visuals: [code]
    expression: explaining
    optional: true
  - id: review
    eyebrow: Compatibility
    eyebrows: { ko: '호환성', ja: '互換性', zh: '兼容性' }
    goal: Who could break, and what to verify.
    visuals: [findings, callout]
    expression: warning
  - id: summary
    eyebrow: Summary
    eyebrows: { ko: '요약', ja: 'まとめ', zh: '总结' }
    goal: The verdict.
    visuals: [summary]
    expression: success
short: [context, exchange, review, summary]
# Where the music lifts: the first scene playing one of these beats, in order.
hero: [exchange]
