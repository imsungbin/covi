id: cli-change
name: CLI change
description: The command, its output before and after, and the lines that changed it.
use_when: The change alters command-line behavior or output.
beats:
  - id: context
    eyebrow: CLI change
    goal: Name the command and the behavior change.
    visuals: [title]
    expression: explaining
  - id: run
    eyebrow: Run it
    goal: Show the command output before and after.
    visuals: [terminal, code]
    expression: explaining
  - id: implementation
    eyebrow: The fix
    goal: The lines responsible.
    visuals: [code]
    expression: explaining
  - id: review
    eyebrow: Worth a look
    goal: Edge cases in input handling or output compatibility.
    visuals: [findings, callout]
    expression: reviewing
  - id: summary
    eyebrow: Summary
    goal: The verdict.
    visuals: [summary]
    expression: success
short: [context, run, implementation, summary]
