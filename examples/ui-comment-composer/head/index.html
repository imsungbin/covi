<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Release notes · Northwind</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><span class="logo">Northwind</span><nav><a href="#">Changelog</a><a href="#">Docs</a></nav></header>
  <main class="post">
    <p class="eyebrow">Release 4.2</p>
    <h1>Faster dashboards and saved filters</h1>
    <p class="lede">Dashboards now load up to 3× faster, and you can save any combination of filters as a named view.</p>
    <section class="comments" aria-labelledby="comments-title">
      <h2 id="comments-title">Comments</h2>
      <ul id="comment-list">
        <li><strong>Priya</strong><p>Saved filters are exactly what our team needed.</p></li>
      </ul>
      <form class="composer" id="composer">
        <label for="comment">Add a comment</label>
        <textarea id="comment" name="comment" rows="4" maxlength="400" placeholder="Share your thoughts…" aria-describedby="counter"></textarea>
        <div class="composer-footer">
          <span id="counter" class="counter" aria-live="polite">280 characters left</span>
          <button id="post" type="submit" disabled>Post</button>
        </div>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
