# Which recipe plays for each on-screen event, and how loud. Effects follow only what the viewer
# sees: a pointer press, the before/after reveal, a finding card landing, the verdict, the outro
# card settling, a scene that pushes, wipes, or zooms through, or that the camera pans or zooms to,
# the hero (a riser into its moment and a hit on it), and a directed shot's motion: the camera
# moving inside a scene, a counter counting, pieces merging into one, and an element appearing. If
# an effect is noticeable, it is too loud. The outro's sign-off plays only without music: with
# music, the music's own sonic logo lands on that moment.
#
# gainDb is relative to the music bed's level under speech (BED_DB in packages/audio/src/placement.ts:
# 15 dB under the voice-normalized stems), with every recipe rendered to a −3 dBFS peak. +1 puts an
# effect's peak about 13 dB under the voice's (the verdict, at +3, measured 10.8–11.4 dB under on
# the examples). Effects keep this level with any placement and without music, and the mix lowers
# them all together if any comes within 8 dB of the voice's peak.

gainDb: 1
# The verdict is the one moment the effects mark the story itself.
verdictBoostDb: 2
# The sign-off plays in the quiet after the last line, where nothing else sounds.
outroBoostDb: 2
# Swells (a transition's whoosh, the camera's, the riser into the hero) are long sounds: they sit
# lower still.
swellCutDb: 4
# A counter's ticks come many to a second, and a shot may reveal several things in a row: the
# ticks and the accents sit lower too.
softCutDb: 4
# Seconds between two effects at least, and effects in any one second at most. When cues compete,
# the outro wins, then the verdict and the hero's hit, then a high-severity finding, then the rest,
# then the accents, and the swells last, the camera's after a scene's entrance. The riser is exempt
# from the spacing (its onset is quiet), not the density. A counter's ticks are one effect, at the
# count's start; two never overlap, and two that touch share the tick where they meet.
minSpacing: 0.15
maxPerSecond: 3

recipes:
  click: click
  reveal: reveal
  finding: finding
  finding-high: finding-high
  verdict-looks-good: verdict-looks-good
  verdict-needs-attention: verdict-needs-attention
  verdict-needs-changes: verdict-needs-changes
  outro-looks-good: outro-looks-good
  outro-needs-attention: outro-needs-attention
  outro-needs-changes: outro-needs-changes
  transition: transition
  riser: riser
  hero: hero
  camera: camera
  count: tick
  merge: thump
  appear: accent
