id: architecture-explainer
name: Architecture explainer
description: A guided walkthrough of a structural change when there is nothing to click.
use_when: A large internal change (refactor, restructuring) where reviewers need a mental model.
beats:
  - id: context
    eyebrow: Restructuring
    goal: Why the structure changed.
    visuals: [title]
    expression: explaining
  - id: map
    eyebrow: The shape
    goal: Which modules moved and how they relate now.
    visuals: [diagram, change-map]
    expression: explaining
  - id: core
    eyebrow: Key seam
    goal: The interface or boundary that matters most.
    visuals: [code]
    expression: explaining
  - id: review
    eyebrow: Worth a look
    goal: Where behavior could have changed by accident.
    visuals: [findings, callout]
    expression: reviewing
  - id: summary
    eyebrow: Summary
    goal: The verdict and a suggested reading order.
    visuals: [summary]
    expression: success
short: [context, map, review, summary]
