# Covi's fixed strings in Japanese. Keys and placeholders match en.yml (a test checks it).
# Sentences join without spaces, so messages that continue a sentence have no leading space.

languageName:
  en: 英語
  ko: 韓国語
  ja: 日本語
  zh: 中国語（簡体字）

# Names of change areas Covi groups files into.
area:
  root: プロジェクトのルート
  github: GitHub の設定
  other: その他のファイル

