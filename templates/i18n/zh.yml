rule:
  async-foreach:
    checks: 传给 forEach 的 async 回调（不会被 await）
    title: '{path} 中把 async 回调传给了 forEach'
    explanation: 'forEach 会忽略回调返回的 Promise：循环会在工作完成前结束，失败会变成未处理的 rejection，顺序也无法保证。'
    suggestion: '顺序执行请用 `for (const x of items) await ...`，并行执行请用 `await Promise.all(items.map(...))`。'
  empty-catch:
    checks: 被捕获后又被悄悄丢弃的错误
    title: '{path} 中的错误被悄悄吞掉了'
    explanation: 这个代码块中的失败会在没有日志、没有恢复的情况下消失，既会隐藏缺陷，也会让故障难以排查。
    suggestion: 显式处理错误、记录日志，或让它继续向上抛出；如果是有意忽略，请在注释中说明原因。
  error-handling-removed:
    checks: 被删除且没有替代的错误处理
    title: '{path} 中删除了错误处理'
    evidence: '删除了{removed}，新增了 {added} 行。第一处删除：{line}（原第 {number} 行）'
    lines: { other: '{count} 行错误处理代码' }
    explanation: 原本在这里处理的失败，现在可能会传到调用方，或使操作崩溃。
    suggestion: 确认这些失败情况仍在别处得到处理（或者现在已不可能发生）。
  removed-export-still-referenced:
    checks: 其他文件仍在使用的已删除或已重命名的导出
    title: '已删除的导出 {name} 仍被引用'
    evidence: "{name} 已从 {path} 中删除，但仍有{references}：\n{sample}"
    references: { other: ' {count} 处引用' }
    explanation: 仍在导入或调用被删除符号的代码会编译失败，或在运行时抛出异常。
    suggestion: '更新剩余的引用，或把 {name} 保留为已弃用的别名。'
  route-removed:
    checks: 被删除或重命名的 API 路由
    title: 'API 路由 {route} 已删除'
    evidence: '{file} 中已不再有 {route} 的路由定义。'
    explanation: 调用这个路由的现有客户端、集成或缓存的前端将开始收到错误。
    suggestion: 确认没有客户端依赖它，或者保留它并设置弃用期。
  destructive-migration:
    checks: 破坏性的模式和数据迁移
    title: '{file} 中的破坏性迁移'
    explanation: '{operations}在没有备份的情况下无法撤销，部署期间仍在运行旧版本的代码也可能出错。'
    suggestion: 采用扩展/收缩（expand/contract）的方式上线（先停止使用该列，在之后的版本中再删除），并确认备份。
  schema-without-migration:
    checks: 没有迁移的 ORM 模式变更
    title: '{kind}有变化，但没有迁移'
    prisma: Prisma 模式
    django: Django 模型
    evidence: '{path} 修改了模型字段，但这个变更中没有新增迁移文件。'
    explanation: 已部署的数据库仍保留旧模式，因此使用新字段的查询会在运行时失败。
    suggestion: 生成迁移，并与模式变更一起提交。
  img-missing-alt:
    checks: 没有替代文本的图片
    title: '{path} 中有没有替代文本（alt）的图片'
    explanation: 屏幕阅读器会把没有 alt 的图片读成文件名或直接跳过，图片的含义就丢失了。
    suggestion: 添加描述图片内容的 alt="…"；如果只是装饰，请用 alt=""。
  focus-outline-removed:
    checks: 被移除且没有可见替代的焦点指示
    title: '{path} 中移除了焦点轮廓'
    explanation: '键盘用户依靠焦点轮廓判断当前位置。没有 :focus-visible 替代就移除它，会让界面在没有鼠标时难以使用。'
    suggestion: '保留可见的焦点样式，例如 `:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }`。'
  click-on-static-element:
    checks: 加在非交互元素上、没有键盘支持的点击处理
    title: '{path} 中可点击的 <{tag}> 无法通过键盘访问'
    explanation: '只有点击处理的 <{tag}> 无法用 Tab 聚焦，也无法用 Enter/Space 激活，屏幕阅读器也不会把它读作控件。'
    suggestion: '请使用 <button>（或添加 role="button"、tabIndex={0} 和按键处理）。'
  secret-in-diff:
    checks: 添加到仓库中的凭据或私钥
    title: '{path} 中提交了{label}'
    evidence: '新增的行中有一个值符合{label}的格式：{value}'
    explanation: 提交的内容对所有能访问仓库的人都可见，即使删除后也会留在 git 历史中。
    suggestion: 立即吊销并轮换这个凭据，然后改为从密钥存储或环境变量中读取。
    label:
      private-key: 私钥
  merge-conflict-markers:
    checks: 遗留的合并冲突标记
    title: '{path} 中有未解决的合并冲突'
    evidence: '新增了冲突标记：{line}'
    explanation: 文件中同时包含冲突的双方内容，将无法解析或无法按预期运行。
    suggestion: '解决冲突，并删除 <<<<<<< / ======= / >>>>>>> 标记。'
  focused-test:
    checks: 会悄悄跳过其余测试的聚焦测试（.only）
    title: '{path} 中遗留了聚焦测试（.only）'
    explanation: 聚焦测试会让运行器跳过同一范围内的其他所有测试，因此 CI 可能在没有运行它们的情况下通过。
    suggestion: 合并前请删除 `.only`。
  skipped-test:
    checks: 新跳过或被禁用的测试
    title: '{path} 中的测试被跳过'
    titleMany: '{count} 个测试被跳过'
    explanation: 被跳过的测试不再保护它所覆盖的行为。这可能是有意的，但应当经过慎重考虑。
    suggestion: 确认跳过是有意为之，并跟踪何时重新启用。
  debug-leftover:
    checks: 应用代码中遗留的 debugger 语句和断点
    title: '{path} 中遗留了调试断点'
    explanation: 只要连接了开发者工具或调试器，断点就会暂停执行，几乎从来不是有意要发布的。
    suggestion: 删除这个断点。
  lockfile-out-of-sync:
    checks: 依赖清单有变化但锁文件没有同步
    title: '{manifest} 有变化，但 {lockfile} 没有'
    evidence: '依赖有变化（{dependencies}），但 {lockfile} 没有更新。'
    explanation: 可复现的安装（npm ci、cargo build --locked 等）会失败，或解析出与测试时不同的版本。
    suggestion: '运行包管理器的安装命令，并提交更新后的 {lockfile}。'
  major-dependency-upgrade:
    checks: 依赖的主版本升级
    title: '{name} 的主版本升级'
    titleMany: '{count} 个依赖的主版本升级'
    explanation: 主版本是库引入破坏性变更的地方；即使代码能编译，行为也可能改变。
    suggestion: 浏览发行说明，看看有没有影响本项目用法的破坏性变更。
  env-var-undocumented:
    checks: 环境变量示例文件中缺少的新环境变量
    title: '新的环境变量 {name} 没有写入文档'
    titleMany: '{count} 个新的环境变量没有写入文档'
    evidence:
      other: '代码会读取 {names}，但 {file} 中没有。'
    explanation: 部署人员和队友依靠示例文件了解需要设置什么；缺少的变量通常会表现为运行时错误。
    suggestion:
      other: '把它们连同安全的占位值一起加到 {file} 中。'
  missing-tests:
    checks: 没有配套测试的行为变化
    titleBugFix: 没有回归测试的缺陷修复
    title: 没有测试的行为变化
    evidence: '{files}有变化（新增 {lines} 行），但没有测试文件变化：{list}。'
    sourceFiles: { other: '{count} 个源文件' }
    explanationBugFix: 如果没有在修复前会失败的测试，这个缺陷可能会悄悄回来。
    explanation: 没有测试的新行为，在之后的变更中很容易被破坏。
    suggestionBugFix: 添加一个能复现原始缺陷的测试。
    suggestion: 为新行为的主要路径添加测试。
  intent-mismatch:
    checks: 声明的意图与实际变更不一致
    title: '描述为{kind}的变更改变了行为'
    explanation: 审查者会根据描述决定读得多仔细；没有说明的行为变化很容易被忽略。
    suggestion: 确认行为变化是有意为之，并在描述中写明。
  dangerous-html:
    checks: 原始 HTML 注入点（innerHTML、dangerouslySetInnerHTML、v-html）
    title: '{path} 中渲染了未经清理的 HTML'
    explanation: '{api} 会把标记当作 HTML 渲染。只要其中有一部分来自用户或外部数据，就会成为跨站脚本（XSS）的入口。'
    suggestion: 改为以文本渲染，或在插入前清理标记（例如使用 DOMPurify）。
  dynamic-code-execution:
    checks: eval 和动态构造的代码
    title: '{path} 中动态执行代码'
    explanation: 把字符串当作代码执行，会执行传入的任何内容，也会让静态分析失效，而且很少真的需要。
    suggestion: 改用显式解析或查找表。
  sql-string-building:
    checks: 用字符串插值而不是参数构造的 SQL
    title: '{path} 中用插值构造 SQL'
    explanation: 把值插入 SQL 文本时，只要其中任何一个值可能受用户影响，就有 SQL 注入的风险。
    suggestion: 使用参数化查询（占位符加绑定值）。
  workflow-script-injection:
    checks: 插入了不可信事件数据的 GitHub Actions 脚本
    title: '{path} 中通过 {expression} 的脚本注入'
    explanation: '{expression} 可被攻击者控制，并且会在执行前被代入 shell 脚本，因此精心构造的标题或分支名就能在工作流中执行命令。'
    suggestion: '通过环境变量传递这个值（env: TITLE: ${{ ... }}），并在脚本中引用 "$TITLE"。'
  workflow-pull-request-target:
    checks: 检出不可信 PR 代码的 pull_request_target 工作流
    title: '{path} 中的 pull_request_target 工作流检出了 PR 代码'
    explanation: pull_request_target 运行时带有写权限令牌和仓库密钥。检出并运行 PR 中的代码，会让任何 fork 都能以这些权限执行代码。
    suggestion: 运行 PR 代码的作业请使用 pull_request 触发器；评论等需要权限的步骤，放到另一个不检出 PR 代码的 workflow_run 作业中。
  workflow-broad-permissions:
    checks: 放宽为 write-all 的工作流令牌权限
    title: '{path} 中的工作流授予了 write-all 令牌权限'
    explanation: 每个步骤（包括第三方 action）都会拿到可以推送代码、编辑发行版和修改设置的令牌。
    suggestion: '只授予作业需要的范围（例如 contents: read、pull-requests: write）。'

capture:
  trustHint: '请运行 `covi trust` 审阅并允许它们。'
  skip:
    appStart: 'app.start（{command}）'
    command: '命令“{name}”'
    demonstration: 演示
    pagesFlowsRequests: 页面、流程和请求
    appAt: '{revision} 版本的应用'
    flow: '流程“{name}”'
  reason:
    notTrusted: '这台机器上尚未信任它。{hint}'
    appNotTrusted: '这台机器上尚未信任仓库配置中的应用设置。{hint}'
    cannotRun: 'Covi 不知道如何运行这个项目。请在 .covi/config.yml 中设置 app.start（必要时加上 app.url）或 app.static{example}。'
    example: '，例如 {suggestion}'
    nothing: 没有可以演示的内容。
  finding:
    appStart:
      title: 应用在 head 版本无法启动
      explanation: 应用这个变更后，Covi 无法启动配置好的应用，因此这个变更很可能破坏了启动或构建。
    flow:
      title: '流程“{name}”在 head 版本失败'
      explanation: 应用这个变更后，配置的用户流程无法完成。
    pageError:
      title: '{path} 出现新的 JavaScript 错误'
      explanation: '加载 {path}（{viewport}）时，head 版本会记录 base 版本没有的错误。'
    pageStatus:
      title: '变更后 {path} 返回 HTTP {status}'
      evidence: 'base：HTTP {base}；head：HTTP {head}。'
      explanation: 页面在 base 版本可以加载，应用这个变更后却失败了。
    apiShape:
      title: '{method} {path} 的响应结构变了'
      evidence: '在两个版本中调用 {method} {path} 观察到：{shape}。'
      explanation: 解析旧结构的现有客户端，如果不在同一个版本中一起更新，就会出错。
      suggestion: 为接口加上版本号、用参数保留旧结构，或在这个变更中更新所有客户端。
    apiStatus:
      title: '{method} {path} 现在以 HTTP {status} 失败'
      evidence: 'base：HTTP {base}；head：HTTP {head}。{body}'
      explanation: 这个接口在变更前可以工作，应用变更后返回服务器错误。
    command:
      title: '`{command}` 现在失败了'
      evidence: "base 的退出码为 {base}，head 的退出码为 {head}。\n{output}"
      explanation: 演示命令在没有这个变更时成功，应用变更后失败。
      timeout: 超时
  shape:
    kindChanged: '响应从 JSON {from}变成了 JSON {to}{keys}'
    keys: '，键为 {keys}'
    removed: { other: '删除了字段 {fields}' }
    retyped: '改变了 {fields} 的类型'
    retypedField: '{path}（{from} → {to}）'
    value: 值
    response: '响应{parts}'
    and: '，并'
    kind:
      array: 数组
      object: 对象
      string: 字符串
      number: 数字
      boolean: 布尔值
      'null': 'null'
      unknown: 未知
      bigint: bigint
      undefined: undefined
      function: 函数
      symbol: 符号

