    depRemoved: '{name} 삭제'
    depUpgraded: '{name} 업그레이드 {from} → {to}{major}'
    depDowngraded: '{name} 다운그레이드 {from} → {to}{major}'
    major: '(메이저)'
    envVar: '새 환경 변수 {name} 사용'
    styles: '{names}{more}의 스타일 수정'
    stylesMore: ' 외 {count}개'
    edits: '{names}{more} 편집'
    editsMore: ' 외 파일 {count}개'
  summary:
    touches: '{where}에 걸쳐 있습니다(+{additions} −{deletions}).'
    filesAcross: '{areas}{more}의 {files}'
    andMore: ' 등'
    filesIn: '{area}의 {files}'
    userVisible: '사용자에게 보이는 변경입니다({kinds}).'
    noSurface: 사용자가 보는 표면(UI, API, CLI)은 건드리지 않습니다.
    lowConfidence: 의도는 제한된 근거로 추정한 것이니 가설로 받아들이세요.
  notes:
    startWith: '{path}부터 보세요: {reason}'
    noTests:
      other: '수정된 소스 파일 {count}개와 함께 바뀐 테스트가 없습니다.'
    uncommitted: 작업 트리의 커밋하지 않은 작업이 포함되어 있습니다.
  architecture:
    spans: '{areas}에 걸쳐 있습니다: {list}.'
    internal: 내부
    dependencies: '의존성 그래프 변경: {packages}.'
    data: '데이터 모델 변경: {list}.'
    api: 'API 표면 변경: {list}.'
  headline: '{area}의 변경'
  repository: 저장소
  behavior:
    canRun: Covi가 이 프로젝트를 실행해 동작을 보여 줄 수 있습니다. 데모 산출물이 있으면 확인하세요.
    cannotRun: 동작은 관찰하지 못했습니다. Covi가 캡처하도록 app.start나 app.static을 설정하세요.
  demoKind:
    ui: UI
    interaction: 상호작용
    visual: 화면
    api: API
    cli: CLI
    architecture: 아키텍처

rule:
  async-foreach:
    checks: forEach에 넘긴 async 콜백(await되지 않음)
    title: '{path}에서 forEach에 async 콜백을 넘깁니다'
    explanation: 'forEach는 콜백이 반환한 프로미스를 무시합니다. 작업이 끝나기 전에 반복이 끝나고, 실패는 처리되지 않은 rejection이 되며, 순서도 보장되지 않습니다.'
    suggestion: '순차 작업에는 `for (const x of items) await ...`를, 병렬 작업에는 `await Promise.all(items.map(...))`를 쓰세요.'
  empty-catch:
    checks: 잡은 뒤 조용히 버리는 오류
    title: '{path}에서 오류를 조용히 삼킵니다'
    explanation: 이 블록의 실패는 로그나 복구 없이 사라집니다. 버그가 숨고 장애 원인을 찾기 어려워집니다.
    suggestion: 오류를 명시적으로 처리하거나, 로그를 남기거나, 전파하세요. 일부러 무시한다면 주석으로 이유를 남기세요.
  error-handling-removed:
    checks: 대체 없이 삭제된 오류 처리
    title: '{path}에서 오류 처리가 삭제되었습니다'
    evidence: '{removed} 삭제, {added}줄 추가. 처음 삭제된 줄: {line}(이전 {number}행)'
    lines: { other: '오류 처리 코드 {count}줄' }
    explanation: 여기서 처리하던 실패가 이제 호출한 쪽으로 전파되거나 작업을 중단시킬 수 있습니다.
    suggestion: 실패 상황이 여전히 어딘가에서 처리되는지(또는 이제 일어날 수 없는지) 확인하세요.
  removed-export-still-referenced:
    checks: 다른 파일이 아직 쓰는, 삭제되거나 이름이 바뀐 export
    title: '삭제된 export {name}{을/를} 아직 참조합니다'
    evidence: "{name}{이/가} {path}에서 삭제되었지만 {references}{이/가} 남아 있습니다:\n{sample}"
    references: { other: '참조 {count}곳' }
    explanation: 삭제된 심볼을 아직 import하거나 호출하는 코드는 컴파일에 실패하거나 실행 중에 예외를 던집니다.
    suggestion: '남은 참조를 고치거나, {name}{을/를} deprecated 별칭으로 남겨 두세요.'
  route-removed:
    checks: 삭제되거나 이름이 바뀐 API 라우트
    title: 'API 라우트 {route}{이/가} 삭제되었습니다'
    evidence: '{file}에서 {route}의 라우트 정의가 사라졌습니다.'
    explanation: 이 라우트를 호출하는 기존 클라이언트, 연동, 캐시된 프런트엔드가 오류를 받기 시작합니다.
    suggestion: 의존하는 클라이언트가 없는지 확인하거나, 지원 중단 기간을 두고 유지하세요.
  destructive-migration:
    checks: 파괴적인 스키마·데이터 마이그레이션
    title: '{file}의 파괴적인 마이그레이션'
    explanation: '{operations}{은/는} 백업 없이는 되돌릴 수 없고, 배포 중 이전 버전을 실행하는 코드가 깨질 수 있습니다.'
    suggestion: 확장/축소(expand/contract) 방식으로 배포하고(먼저 열을 쓰지 않게 한 뒤 다음 릴리스에서 삭제), 백업을 확인하세요.
  schema-without-migration:
    checks: 마이그레이션 없는 ORM 스키마 변경
    title: '마이그레이션 없이 {kind}{이/가} 바뀌었습니다'
    prisma: Prisma 스키마
    django: Django 모델
    evidence: '{path}{이/가} 모델 필드를 바꾸지만, 이 변경에는 마이그레이션 파일이 추가되지 않았습니다.'
    explanation: 배포된 데이터베이스는 이전 스키마를 그대로 쓰므로 새 필드를 쓰는 쿼리가 실행 중에 실패합니다.
    suggestion: 스키마 변경과 함께 마이그레이션을 생성해 커밋하세요.
  img-missing-alt:
    checks: 대체 텍스트가 없는 이미지
    title: '{path}에 대체 텍스트(alt)가 없는 이미지가 있습니다'
    explanation: 스크린 리더는 alt가 없는 이미지를 파일 이름으로 읽거나 건너뛰므로 이미지의 의미가 전달되지 않습니다.
    suggestion: 이미지를 설명하는 alt="…"를 추가하거나, 장식용이면 alt=""를 쓰세요.
  focus-outline-removed:
    checks: 보이는 대체 없이 제거된 포커스 표시
    title: '{path}에서 포커스 외곽선을 없앴습니다'
    explanation: '키보드 사용자는 포커스 외곽선으로 현재 위치를 확인합니다. :focus-visible 대체 없이 없애면 마우스 없이 쓰기 어려워집니다.'
    suggestion: '보이는 포커스 스타일을 유지하세요. 예: `:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }`.'
  click-on-static-element:
    checks: 키보드 지원 없이 상호작용 불가 요소에 단 클릭 핸들러
    title: '{path}의 클릭 가능한 <{tag}> 요소는 키보드로 쓸 수 없습니다'
    explanation: '클릭 핸들러만 단 <{tag}> 요소는 Tab으로 이동하거나 Enter/Space로 실행할 수 없고, 스크린 리더도 컨트롤로 알려 주지 않습니다.'
    suggestion: '<button>을 쓰세요(또는 role="button", tabIndex={0}, 키 핸들러를 추가하세요).'
  secret-in-diff:
    checks: 저장소에 추가된 자격 증명이나 개인 키
    title: '{path}에 {label}{이/가} 커밋되었습니다'
    evidence: '추가된 줄에 {label} 형식과 일치하는 값이 있습니다: {value}'
    explanation: 커밋된 내용은 저장소에 접근할 수 있는 모두가 읽을 수 있고, 삭제한 뒤에도 git 기록에 남습니다.
    suggestion: 지금 자격 증명을 폐기하고 교체한 뒤, 시크릿 저장소나 환경 변수에서 불러오세요.
    label:
      private-key: 개인 키
  merge-conflict-markers:
    checks: 남아 있는 병합 충돌 표시
    title: '{path}에 해결하지 않은 병합 충돌이 있습니다'
    evidence: '추가된 충돌 표시: {line}'
    explanation: 파일에 충돌한 양쪽 내용이 모두 들어 있어서 파싱되지 않거나 의도대로 동작하지 않습니다.
    suggestion: '충돌을 해결하고 <<<<<<< / ======= / >>>>>>> 표시를 지우세요.'
  focused-test:
    checks: 나머지 테스트를 조용히 건너뛰게 하는 집중 테스트(.only)
    title: '{path}에 집중 테스트(.only)가 남아 있습니다'
    explanation: 집중 테스트는 같은 범위의 다른 테스트를 모두 건너뛰게 하므로, 그 테스트들을 실행하지 않고도 CI가 통과할 수 있습니다.
    suggestion: 머지하기 전에 `.only`를 지우세요.
  skipped-test:
    checks: 새로 건너뛰거나 비활성화한 테스트
    title: '{path}의 테스트를 건너뜁니다'
    titleMany: '테스트 {count}개를 건너뜁니다'
    explanation: 건너뛴 테스트는 더 이상 해당 동작을 지켜 주지 않습니다. 의도했을 수 있지만, 신중히 결정해야 합니다.
    suggestion: 의도한 건너뛰기인지 확인하고, 다시 켜는 일을 추적하세요.
  debug-leftover:
    checks: 애플리케이션 코드에 남은 debugger 문과 중단점
    title: '{path}에 디버거 중단점이 남아 있습니다'
    explanation: 중단점은 개발자 도구나 디버거가 연결되면 실행을 멈추며, 배포할 생각으로 넣는 경우는 거의 없습니다.
    suggestion: 중단점을 지우세요.
  lockfile-out-of-sync:
    checks: 잠금 파일 없이 바뀐 의존성 매니페스트
    title: '{manifest}{은/는} 바뀌었지만 {lockfile}{은/는} 바뀌지 않았습니다'
    evidence: '의존성이 바뀌었지만({dependencies}) {lockfile}{은/는} 갱신되지 않았습니다.'
    explanation: 재현 가능한 설치(npm ci, cargo build --locked 등)가 실패하거나, 테스트한 것과 다른 버전을 받게 됩니다.
    suggestion: '패키지 관리자로 설치를 실행하고 갱신된 {lockfile}{을/를} 커밋하세요.'
  major-dependency-upgrade:
    checks: 의존성의 메이저 버전 업그레이드
    title: '{name}의 메이저 업그레이드'
    titleMany: '의존성 메이저 업그레이드 {count}건'
    explanation: 메이저 버전은 라이브러리가 호환성을 깨는 변경을 하는 곳입니다. 컴파일이 되어도 동작이 바뀔 수 있습니다.
    suggestion: 이 프로젝트가 패키지를 쓰는 방식에 영향을 주는 호환성 변경이 있는지 릴리스 노트를 훑어보세요.
  env-var-undocumented:
    checks: 환경 변수 예시 파일에 빠진 새 환경 변수
    title: '새 환경 변수 {name}{이/가} 문서화되지 않았습니다'
    titleMany: '새 환경 변수 {count}개가 문서화되지 않았습니다'
    evidence:
      other: '코드가 {names}{을/를} 읽지만 {file}에는 빠져 있습니다.'
    explanation: 배포 담당자와 팀원은 예시 파일을 보고 무엇을 설정할지 압니다. 빠진 변수는 보통 실행 중 오류로 드러납니다.
    suggestion:
      other: '안전한 예시 값과 함께 {file}에 추가하세요.'
  missing-tests:
    checks: 테스트가 함께 오지 않은 동작 변경
    titleBugFix: 회귀 테스트 없는 버그 수정
    title: 테스트 없는 동작 변경
    evidence: '{files}{이/가} 바뀌었고(추가 {lines}줄) 테스트 파일은 바뀌지 않았습니다: {list}.'
    sourceFiles: { other: '소스 파일 {count}개' }
    explanationBugFix: 수정 전에 실패하는 테스트가 없으면 버그가 조용히 돌아올 수 있습니다.
    explanation: 테스트 없는 새 동작은 이후 변경에서 쉽게 깨집니다.
    suggestionBugFix: 원래 버그를 재현하는 테스트를 추가하세요.
    suggestion: 새 동작의 주요 경로에 대한 테스트를 추가하세요.
  intent-mismatch:
    checks: 밝힌 의도와 실제 변경의 불일치
    title: '{kind}{으로/로} 설명된 변경이 동작을 바꿉니다'
    explanation: 리뷰어는 설명을 보고 얼마나 꼼꼼히 읽을지 정합니다. 알리지 않은 동작 변경은 놓치기 쉽습니다.
    suggestion: 동작 변경이 의도한 것인지 확인하고 설명에 적어 주세요.
  dangerous-html:
    checks: 원시 HTML 삽입 지점(innerHTML, dangerouslySetInnerHTML, v-html)
    title: '{path}에서 정제하지 않은 HTML을 렌더링합니다'
    explanation: '{api} 부분이 마크업을 HTML로 렌더링합니다. 일부라도 사용자나 외부 데이터에서 온다면 크로스 사이트 스크립팅(XSS) 통로가 됩니다.'
    suggestion: HTML 대신 텍스트로 렌더링하거나, 삽입하기 전에 마크업을 정제하세요(예를 들어 DOMPurify로).
  dynamic-code-execution:
    checks: eval과 동적으로 만든 코드
    title: '{path}에서 동적으로 코드를 실행합니다'
    explanation: 문자열을 코드로 실행하면 그 문자열에 들어온 무엇이든 실행되고, 정적 분석이 무력해집니다. 꼭 필요한 경우도 드뭅니다.
    suggestion: 명시적인 파싱이나 조회 테이블로 바꾸세요.
  sql-string-building:
    checks: 매개변수 대신 문자열 보간으로 만든 SQL
    title: '{path}에서 보간한 값으로 SQL을 만듭니다'
    explanation: 값을 SQL 텍스트에 보간하면, 그중 하나라도 사용자가 영향을 줄 수 있을 때 SQL 인젝션이 가능해집니다.
    suggestion: 매개변수화 쿼리(자리표시자와 바인딩한 값)를 쓰세요.
  workflow-script-injection:
    checks: 신뢰할 수 없는 이벤트 데이터를 보간하는 GitHub Actions 스크립트
    title: '{path}에서 {expression}{을/를} 통한 스크립트 인젝션'
    explanation: '{expression}{은/는} 공격자가 제어할 수 있는 값이고 실행 전에 셸 스크립트에 그대로 들어갑니다. 조작된 제목이나 브랜치 이름으로 워크플로에서 명령을 실행할 수 있습니다.'
    suggestion: '값을 환경 변수로 넘기고(env: TITLE: ${{ ... }}) 스크립트에서는 "$TITLE"로 참조하세요.'
  workflow-pull-request-target:
    checks: 신뢰할 수 없는 PR 코드를 체크아웃하는 pull_request_target 워크플로
    title: '{path}의 pull_request_target 워크플로가 PR 코드를 체크아웃합니다'
    explanation: pull_request_target은 쓰기 토큰과 저장소 시크릿을 가진 채 실행됩니다. PR의 코드를 체크아웃해 실행하면 어떤 포크든 그 권한으로 코드를 실행할 수 있습니다.
    suggestion: PR 코드를 실행하는 작업에는 pull_request 트리거를 쓰고, 댓글 달기처럼 권한이 필요한 단계는 PR 코드를 체크아웃하지 않는 별도의 workflow_run 작업으로 나누세요.
  workflow-broad-permissions:
    checks: write-all로 넓힌 워크플로 토큰 권한
    title: '{path}의 워크플로가 write-all 토큰 권한을 줍니다'
    explanation: 서드파티 액션을 포함한 모든 단계가 코드를 push하고, 릴리스를 고치고, 설정을 바꿀 수 있는 토큰을 받습니다.
    suggestion: '작업에 필요한 범위만 주세요(예: contents: read, pull-requests: write).'

capture:
  trustHint: '`covi trust`로 검토하고 허용하세요.'
  skip:
    appStart: 'app.start({command})'
    command: '명령 "{name}"'
    demonstration: 시연
    pagesFlowsRequests: 페이지, 흐름, 요청
