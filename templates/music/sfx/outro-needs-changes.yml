# Covi's sign-off when no music plays and the change needs changes: the sonic logo settles on 6
# below the tonic over a calm vi7, like the theme's minor ending. Gentle, never ominous. Same
# shape and timing as outro-looks-good: the landing is 0.45 s in.
id: outro-needs-changes
