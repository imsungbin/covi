id: round-bass
description: Round, friendly bass. Sine body with triangle and a trace of saw for definition on small speakers, lightly saturated, never boomy.
algo: subtractive
oscs:
  - { wave: sine, level: 0.8 }
  - { wave: triangle, level: 0.35 }
  - { wave: saw, level: 0.08 }
filter: { type: lowpass, cutoff: 520, q: 0.8, env: 1.2, keytrack: 0.5, adsr: { a: 0.002, d: 0.14, s: 0.2, r: 0.1 } }
highpass: 38
drive: 0.25
amp: { a: 0.004, d: 0.3, s: 0.8, r: 0.09 }
