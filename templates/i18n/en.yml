# Built-in review rules: what each checks (shown under "What Covi checked") and what it reports.
rule:
  async-foreach:
    checks: async callbacks passed to forEach (never awaited)
    title: forEach with an async callback in {path}
    explanation: 'forEach ignores the promises its callback returns: the loop finishes before the work does, failures become unhandled rejections, and ordering is not guaranteed.'
    suggestion: Use `for (const x of items) await ...` for sequential work or `await Promise.all(items.map(...))` for parallel work.
  empty-catch:
    checks: errors that are caught and silently discarded
    title: Error silently swallowed in {path}
    explanation: Failures in this block disappear without logging or recovery, which hides bugs and makes incidents hard to diagnose.
    suggestion: Handle the error explicitly, log it, or let it propagate; if ignoring is intentional, say why in a comment.
  error-handling-removed:
    checks: error handling removed without replacement
    title: Error handling removed in {path}
    evidence: '{removed} removed, {added} added. First removed: {line} (old line {number})'
    lines: { one: '{count} error-handling line', other: '{count} error-handling lines' }
    explanation: Failures that used to be handled here may now propagate to callers or crash the operation.
    suggestion: Confirm the failure cases are still handled somewhere (or are impossible now).
  removed-export-still-referenced:
    checks: removed or renamed exports that other files still use
    title: Removed export {name} is still referenced
    evidence: "{name} was removed from {path}, but {references} remain:\n{sample}"
    references: { one: '{count} reference', other: '{count} references' }
    explanation: Code that still imports or calls the removed symbol will fail to compile or throw at runtime.
    suggestion: Update the remaining references, or keep {name} as a deprecated alias.
  route-removed:
    checks: API routes removed or renamed
    title: API route {route} removed
    evidence: The route definition for {route} is gone from {file}.
    explanation: Existing clients, integrations, or cached frontends calling this route will start receiving errors.
    suggestion: Confirm no clients depend on it, or keep it with a deprecation period.
  destructive-migration:
    checks: destructive schema and data migrations
    title: Destructive migration in {file}
    explanation: '{operations} cannot be undone without a backup, and code still running the previous version during deploy may break.'
    suggestion: Use an expand/contract rollout (stop using the column first, drop it in a later release) and confirm backups.
  schema-without-migration:
    checks: ORM schema changes without a migration
    title: '{kind} changed without a migration'
    prisma: Prisma schema
    django: Django model
    evidence: '{path} changes model fields, and no migration file is added in this change.'
    explanation: Deployed databases keep the old schema, so queries for the new fields fail at runtime.
    suggestion: Generate and commit the migration alongside the schema change.
  img-missing-alt:
    checks: images without alternative text
    title: Image without alt text in {path}
    explanation: Screen readers announce images without alt text as a file name or skip them, so their meaning is lost.
    suggestion: Add alt="…" describing the image, or alt="" if it is purely decorative.
  focus-outline-removed:
    checks: focus indicators removed without a visible replacement
    title: Focus outline removed in {path}
    explanation: 'Keyboard users rely on the focus outline to see where they are. Removing it without a :focus-visible replacement makes the interface hard to use without a mouse.'
    suggestion: 'Keep a visible focus style, for example `:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }`.'
  click-on-static-element:
    checks: click handlers on non-interactive elements without keyboard support
    title: Clickable <{tag}> is not keyboard accessible in {path}
    explanation: A <{tag}> with a click handler cannot be reached with Tab or activated with Enter/Space, and screen readers do not announce it as a control.
    suggestion: Use a <button> (or add role="button", tabIndex={0}, and a key handler).
  secret-in-diff:
    checks: credentials or private keys added to the repository
    title: '{label} committed in {path}'
    evidence: 'Added line contains a value matching the {label} format: {value}'
    explanation: Anything committed is readable by everyone with repository access and stays in git history even after it is deleted.
    suggestion: Revoke and rotate the credential now, then load it from a secret store or environment variable.
    label:
      private-key: private key
  merge-conflict-markers:
    checks: leftover merge conflict markers
    title: Unresolved merge conflict in {path}
    evidence: 'Conflict marker added: {line}'
    explanation: The file contains both sides of a conflict and will not parse or behave as intended.
    suggestion: Resolve the conflict and remove the <<<<<<< / ======= / >>>>>>> markers.
  focused-test:
    checks: focused tests (.only) that silently skip the rest of the suite
    title: Focused test left in {path}
    explanation: A focused test makes the runner skip every other test in its scope, so CI can pass without running them.
    suggestion: Remove `.only` before merging.
  skipped-test:
    checks: tests that are newly skipped or disabled
    title: Test skipped in {path}
    titleMany: '{count} tests skipped'
    explanation: Skipped tests stop protecting the behavior they cover. That can be intentional, but it should be deliberate.
    suggestion: Confirm the skip is intended and track re-enabling it.
  debug-leftover:
    checks: debugger statements and breakpoints left in application code
    title: Debugger breakpoint left in {path}
    explanation: Breakpoints pause execution when developer tools or a debugger are attached and are almost never meant to ship.
    suggestion: Remove the breakpoint.
  lockfile-out-of-sync:
    checks: dependency manifests changed without their lockfile
    title: '{manifest} changed but {lockfile} did not'
    evidence: Dependency changes ({dependencies}) with no update to {lockfile}.
    explanation: Reproducible installs (npm ci, cargo build --locked, …) will fail or resolve versions different from the ones that were tested.
    suggestion: Run the package manager's install and commit the updated {lockfile}.
  major-dependency-upgrade:
    checks: major-version dependency upgrades
    title: Major upgrade of {name}
    titleMany: '{count} major dependency upgrades'
    explanation: Major versions are where libraries make breaking changes; behavior can change even when the code compiles.
    suggestion: Skim the release notes for breaking changes that affect how this project uses the package.
  env-var-undocumented:
    checks: new environment variables missing from env examples
    title: New environment variable {name} is not documented
    titleMany: '{count} new environment variables are not documented'
    evidence:
      one: '{names} is read by the code but missing from {file}.'
      other: '{names} are read by the code but missing from {file}.'
    explanation: Deployments and teammates rely on the example file to know what to set; a missing variable usually surfaces as a runtime failure.
    suggestion:
      one: Add it to {file} with a safe placeholder value.
      other: Add them to {file} with a safe placeholder value.
  missing-tests:
    checks: behavior changes without accompanying tests
    titleBugFix: Bug fix without a regression test
    title: Behavior change without tests
    evidence: '{files} changed ({lines} added lines) and no test files changed: {list}.'
    sourceFiles: { one: '{count} source file', other: '{count} source files' }
    explanationBugFix: Without a test that fails before the fix, the bug can quietly return.
    explanation: New behavior without tests is easy to break in later changes.
    suggestionBugFix: Add a test that reproduces the original bug.
    suggestion: Add tests for the main paths of the new behavior.
  intent-mismatch:
    checks: mismatch between the stated intent and what the change does
    title: Change is described as {kind} but changes behavior
    explanation: Reviewers calibrate how closely they read based on the description; an unannounced behavior change is easy to miss.
    suggestion: Confirm the behavior change is intended and mention it in the description.
  dangerous-html:
    checks: raw HTML injection points (innerHTML, dangerouslySetInnerHTML, v-html)
    title: Unsanitized HTML rendering in {path}
    explanation: '{api} renders markup as HTML. If any part of it comes from users or external data, this is a cross-site scripting vector.'
    suggestion: Render text instead of HTML, or sanitize the markup (for example with DOMPurify) before inserting it.
  dynamic-code-execution:
    checks: eval and dynamically constructed code
    title: Dynamic code execution in {path}
    explanation: Evaluating strings as code executes whatever reaches it, defeats static analysis, and is rarely necessary.
    suggestion: Replace with explicit parsing or a lookup table.
  sql-string-building:
    checks: SQL built by string interpolation instead of parameters
    title: SQL built from interpolated values in {path}
    explanation: Interpolating values into SQL text allows SQL injection whenever any value can be influenced by a user.
    suggestion: Use parameterized queries (placeholders with bound values).
  workflow-script-injection:
    checks: GitHub Actions scripts that interpolate untrusted event data
    title: Script injection via {expression} in {path}
    explanation: '{expression} is attacker-controlled and is substituted into the shell script before it runs, so a crafted title or branch name executes commands in the workflow.'
    suggestion: 'Pass the value through an environment variable (env: TITLE: ${{ ... }}) and reference "$TITLE" in the script.'
  workflow-pull-request-target:
    checks: pull_request_target workflows that check out untrusted pull request code
    title: pull_request_target workflow checks out pull request code in {path}
    explanation: pull_request_target runs with a write token and repository secrets. Checking out and running code from the pull request lets any fork execute code with those privileges.
    suggestion: Use the pull_request trigger for jobs that run PR code, and a separate workflow_run job (without checkout of PR code) for privileged steps like commenting.
  workflow-broad-permissions:
    checks: workflow token permissions broadened to write-all
    title: Workflow grants write-all token permissions in {path}
    explanation: Every step, including third-party actions, receives a token that can push code, edit releases, and change settings.
    suggestion: 'Grant only the scopes the job needs (for example contents: read, pull-requests: write).'

capture:
  trustHint: Run `covi trust` to review and allow them.
  skip:
    appStart: app.start ({command})
    command: command "{name}"
    demonstration: demonstration
    pagesFlowsRequests: pages, flows, and requests
    appAt: app at {revision}
    flow: flow "{name}"
  reason:
    notTrusted: Not trusted on this machine yet. {hint}
    appNotTrusted: The app settings in the repository configuration are not trusted on this machine yet. {hint}
    cannotRun: Covi does not know how to run this project. Set app.start (and app.url if needed) or app.static in .covi/config.yml{example}.
    example: ', e.g. {suggestion}'
    nothing: Nothing to demonstrate.
  finding:
    appStart:
      title: The app does not start at the head revision
      explanation: Covi could not start the configured app with this change applied, so the change likely breaks startup or the build.
    flow:
      title: Flow "{name}" fails at the head revision
      explanation: A configured user flow could not be completed with this change applied.
    pageError:
      title: New JavaScript error on {path}
      explanation: Loading {path} ({viewport}) logs errors at the head revision that do not occur at the base revision.
    pageStatus:
      title: '{path} returns HTTP {status} after the change'
      evidence: 'Base: HTTP {base}; head: HTTP {head}.'
      explanation: The page loads at the base revision but fails with this change.
    apiShape:
      title: '{method} {path} changed its response shape'
      evidence: 'Observed by calling {method} {path} at both revisions: {shape}.'
      explanation: Existing clients that parse the previous shape will break unless they are updated in the same release.
      suggestion: Version the endpoint, keep the old shape behind a parameter, or update every client in this change.
    apiStatus:
      title: '{method} {path} now fails with HTTP {status}'
      evidence: 'Base: HTTP {base}; head: HTTP {head}. {body}'
      explanation: The endpoint worked before this change and returns a server error with it.
    command:
      title: '`{command}` now fails'
      evidence: "Exit code {base} at base, {head} at head.\n{output}"
      explanation: The demo command succeeds without this change and fails with it.
      timeout: timeout
  shape:
    kindChanged: the response changed from a JSON {from} to a JSON {to}{keys}
    keys: ' with keys {keys}'
    removed: { one: 'removed field {fields}', other: 'removed fields {fields}' }
    retyped: changed the type of {fields}
    retypedField: '{path} ({from} → {to})'
    value: value
    response: the response {parts}
    and: ' and '
    kind:
