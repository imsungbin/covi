# Covi's fixed strings in Korean. Keys and placeholders match en.yml (a test checks it).
# Particles after a placeholder are written as pairs, {을/를}, {이/가}, {은/는}, {와/과}, {으로/로},
# and Covi picks the form that agrees with how the text before them is read aloud.

languageName:
  en: 영어
  ko: 한국어
  ja: 일본어
  zh: 중국어(간체)

# Names of change areas Covi groups files into.
area:
  root: 프로젝트 루트
  github: GitHub 설정
  other: 기타 파일

verdict:
  looks-good: 문제 없음
  needs-attention: 확인 필요
  needs-changes: 수정 필요

certainty:
  confirmed: 확인된 문제
  likely: 가능성 높은 문제
  risk: 확인할 위험
  question: 질문

certaintyCount:
  confirmed: { other: '확인된 문제 {count}건' }
  likely: { other: '가능성 높은 문제 {count}건' }
  risk: { other: '확인할 위험 {count}건' }
  question: { other: '질문 {count}건' }

severity:
  high: 높음
  medium: 보통
  low: 낮음

confidence:
  high: 높음
  medium: 보통
  low: 낮음

category:
  correctness: 정확성
  regression: 회귀
  edge-case: 경계 조건
  error-handling: 오류 처리
  state: 상태
  concurrency: 동시성
  security: 보안
  permissions: 권한
  api-compatibility: API 호환성
  data-integrity: 데이터 무결성
  performance: 성능
  accessibility: 접근성
  testing: 테스트
  ui: UI
  maintainability: 유지보수성
  complexity: 복잡도
  intent-mismatch: 의도 불일치
  dependency: 의존성
  configuration: 설정

count:
  files: { other: '파일 {count}개' }
  findings: { other: '발견 사항 {count}건' }
  testCases: { other: '테스트 케이스 {count}개' }
  testFiles: { other: '테스트 파일 {count}개' }
  checks: { other: '점검 {count}개' }
  areas: { other: '영역 {count}곳' }
  packages: { other: '패키지 {count}개' }

report:
  footer: 'Covi가 생성함 ({provider})'
  footerChange: 'Covi가 생성함 ({provider}) · {base} {baseSha} → {head} {headSha}'
  explanation:
    why: '**이유:**'
    confidence: '_(확신도: {confidence}.{evidence})_'
    evidence: ' 근거: {evidence}.'
    behavior: 동작
    userVisible: '사용자에게 보이는 변경: {answer}'
    yes: 예
    no: 아니요
    before: '**변경 전:**'
    after: '**변경 후:**'
    changes: 변경 내용
    architecture: 아키텍처
    details: 구현 세부 사항
    reviewerNotes: diff를 읽기 전에
    readingOrder: 추천 읽기 순서
    ambiguities: 열린 질문
  review:
    title: '리뷰: {title}'
    untitled: 코드 변경
    findings: 발견 사항
    evidence: '근거:'
    cited: '인용한 근거: {refs}'
    suggestion: '**제안:**'
    tests: 테스트
    testsPassed: 통과
    testsTimedOut: 시간 초과
    testsFailed: '실패(종료 코드 {code})'
    testsResult: '{command}: {result}, {seconds}초 소요'
    checked: Covi가 점검한 항목
    notVerified: 확인하지 못한 부분
    dismissed: 기각한 항목
  summary:
    changes: '**변경 사항**'
    focus: '**리뷰 포인트**'
    testing: '**테스트**'
    commandPasses: '{command} 통과'
    commandFails: '{command} 실패'
    testsAdded: '{files}에 {cases} 추가'
    noTestChanges: 테스트 변경 없음
    textVerdict: ' 리뷰: {verdict}{findings}.'
    textFindings: ' ({findings})'

comment:
  heading: 'Covi 리뷰: {verdict}'
  watch: '리뷰 영상 보기{duration}'
  finding: 발견 사항
  where: 위치
  details: 발견 사항 자세히
  suggestion: '제안:'
  cited: '인용한 근거: {refs}'
  changes: 변경 내용
  notVerified: 확인하지 못한 부분
  artifacts: 산출물
  run: 실행
  truncated: …(생략됨)
  rate: '도움이 되었나요? 👍 👎 (이 댓글에 반응을 남겨 주세요)'
  anchorRate: 이 발견 사항이 맞으면 👍, 틀리면 👎 반응을 남겨 주세요.

review:
  noIssues: 'Covi가 점검한 범위에서는 문제를 찾지 못했습니다.{tests}'
  testsPass: ' 테스트는 통과합니다.'
  testsFail: ' 테스트가 통과하지 않았습니다.'
  omitted: { other: ' (우선순위가 낮은 메모 {count}건은 review.json의 "omitted"에 있습니다)' }
  testsNotRunEnable: '테스트를 실행하지 않았습니다(review.runTests를 켜거나 --run-tests를 쓰세요).'
  testsNotConfigured: '테스트를 실행하지 않았습니다(test.command가 설정되지 않았습니다).'
  testsTimedOut: 테스트 명령이 시간 초과되었습니다.
  testsFailed: '테스트 명령이 실패했습니다(종료 코드 {code}).'
  notDemonstrated: 사용자에게 보이는 동작은 시연하지 않았고, 코드만 보고 리뷰했습니다.
  rulesOnly: 로직은 Covi의 내장 규칙으로만 점검했습니다. 추론 기반 리뷰가 필요하면 코딩 에이전트에서 Covi를 실행하거나 모델 제공자를 설정하세요.

brief:
  title: 'Covi 브리프: {summary}'
  header: '실행 {runId} · {repository} · {base} {baseSha} → {head} {headSha} · {files}, +{additions} −{deletions} · 규모 {size}'
  language: '언어: 사람이 읽는 문장은 {language}{으로/로} 작성하세요(explanation.json과 findings.json에 `language: {code}`).'
  authorDescription: 작성자 설명
  claim: '> 설명은 작성자의 주장일 뿐 근거가 아닙니다. 코드와 대조해 확인하세요.'
  commits: 커밋
  moreCommits: '…외 {count}개'
  determined: Covi가 파악한 내용
  intent: '**의도:** {kind}(확신도 {confidence}). {evidence}'
  noEvidence: 직접적인 근거가 없습니다.
  ambiguity: '**모호한 점:** {text}'
  areas: '**영역:** {areas}'
  internal: 내부
  surfaces: '**표면:** {surfaces}'
  demonstration: '**시연 가치:** {value}{kinds} → {recommendation}. {reason}'
  runnable: '**앱 실행 가능:** {answer}{suggestions}'
  runnableYes: '예({mode})'
  runnableNo: 아니요
  commands: 명령
  suggestedConfig: '; 추천 설정: {config}'
  tests: '**테스트:** {tests}{frameworks}'
  testChanges: '{files} 변경(케이스 +{cases})'
  noTestChanges: 테스트 변경 없음
  frameworks: '; 프레임워크: {frameworks}'
  dependencies: '**의존성:** {list}'
  envVars: '**환경 변수:** {list}'
  data: '**데이터 변경:** {list}'
  signals: 확인할 신호
  ruleNote: 규칙이 찾은 발견 사항은 근거가 있지만 얕습니다. findings.json에서 하나씩 확정하거나 이유와 함께 기각하세요.
  readingOrder: 추천 읽기 순서
  diff: Diff(우선순위순)
  notInlined: '포함하지 않은 파일:'
  nextSteps: 에이전트의 다음 단계
  artifacts: '산출물은 {dir}에 있습니다.'
  step1: '1. 위 파일들의 주변 코드를 읽으세요. diff만으로는 맥락이 부족합니다.'
  step2: '2. 실행 디렉터리에 `explanation.json`(스키마: `covi schema explanation`)과 `findings.json`(스키마: `covi schema findings`)을 작성하세요.'
  cite: '   각 주장의 근거를 `evidenceIds`에 적으세요(`covi evidence --run {runId}`로 목록을 볼 수 있습니다). 확인된 문제와 가능성 높은 문제에는 근거가 하나 이상 있어야 합니다.'
  step3: '3. `covi report --run {runId}`를 실행해 검증하고 Markdown 보고서를 만드세요.'
  calibrationTitle: 과거 발견 사항의 적중률
  calibrationFrom: { other: '이 저장소에서 앞서 리뷰한 변경 {count}건 기준(`covi outcomes report`):' }
  calibrationLine: '- {certainty}: {labeled}건 중 {right}건이 맞았습니다({percent}%)'
  calibrationNote: '이 수치로 얼마나 확신할지를 가늠하되, 무엇을 보고할지는 바꾸지 마세요. 이것만으로 어떤 발견 사항의 확실성도 바뀌지 않습니다. 각 발견 사항은 그 자체의 근거로 분류하세요.'

