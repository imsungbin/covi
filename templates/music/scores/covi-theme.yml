# The Covi theme: the default music under Covi's review videos.
#
# Character: warm, thoughtful, quietly optimistic, like a capable colleague walking you through a
# change. Not corporate, not hype. The narration is the product, so the music leaves it room: no
# lead melody, and the 300 Hz–3 kHz band kept light. A soft pad is voiced low and filtered, an
# electric piano plays a sparse off-beat figure, a round bass sits under it, and a felt-and-brush
# kit keeps time with a shaker above the voice. Movement is saved for the lift.
#
# 100 bpm in 4/4, E♭ major: E♭ sounds warm on electric piano and keeps the bass clear of the mud.
#
# Harmony (one bar per |):
#   a        I – iii – IV – V6sus    Ebmaj9 | Gm7 | Abmaj9 | Bb6sus
#            A gentle climb that never quite arrives, so the loop can repeat without landing.
#   b        vi – IV – I/3 – ii V    Cm9 | Abmaj7 | Ebmaj7/G | Fm9 Bbsus4
#            The thoughtful turn: it starts from the relative minor and walks back up.
#   lift     IV – V                  Abmaj9 | Bb6sus Bb
#            The hero: Covi puts its first downbeat on the story's payoff. Fuller brushes, an open
#            shaker, a bell answer and a bright pluck arpeggio, plus the accent (+2 dB and a soft
#            crash) every accented section gets.
#   endings  one per review verdict, under the sonic logo Covi adds itself (a pickup of 5 and 1):
#     resolved   I    Ebadd9   the logo lands on 3: settled.
#     open       V    Bbsus4   lands on 2: a question left open.
#     minor      vi7  Cm7      lands on 6, below the tonic: a gentle minor, never ominous.
# The logo plays on the bell, doubled by the pluck.

id: covi-theme
description: Warm, quietly optimistic bed - low soft pad, sparse electric piano, round bass, felt and brush kit; a bell and pluck lift on the payoff; the Covi logo on bell and pluck.
license: original
bpm: 100
meter: 4
key: Eb major

tracks:
  pad: { patch: soft-pad, gain: -18, reverb: 0.35, lowpass: 2400 }
  keys: { patch: e-piano, gain: -17, pan: -0.15, reverb: 0.3, delay: 0.12 }
  bass: { patch: round-bass, gain: -14 }
  kit: { kit: soft-acoustic, gain: -15, reverb: 0.08 }
  bell: { patch: bell, gain: -19, pan: 0.2, reverb: 0.4, delay: 0.2 }
  pluck: { patch: glass-pluck, gain: -22, pan: 0.25, delay: 0.28, reverb: 0.25 }

fx:
  delay: { time: 3/16, feedback: 0.28, lowpass: 4200, highpass: 400 }
  reverb: { size: 0.72, damp: 0.5, width: 0.9 }

patterns:
  # Harmony on the pad, voiced low so it warms without crowding the voice.
  pad_intro: { chords: "Ebmaj9", voicing: [Bb2, Bb4], velocity: 0.7 }
  pad_a: { chords: "Ebmaj9 | Gm7 | Abmaj9 | Bb6sus", voicing: [Bb2, Bb4], velocity: 0.75 }
  pad_b: { chords: "Cm9 | Abmaj7 | Ebmaj7/G | Fm9 Bbsus4", voicing: [Bb2, Bb4], velocity: 0.75 }
  pad_lift: { chords: "Abmaj9 | Bb6sus Bb", voicing: [Bb2, C5], velocity: 0.85 }
  pad_resolved: { chords: "Ebadd9 | .", voicing: [Bb2, Bb4], velocity: 0.75 }
  pad_open: { chords: "Bbsus4 | .", voicing: [Bb2, Bb4], velocity: 0.75 }
  pad_minor: { chords: "Cm7 | .", voicing: [Bb2, Bb4], velocity: 0.7 }

  # The electric piano's off-beat figure: chord tones on the "and"s, soft, swung a little.
  keys_intro: { arp: pad_intro, steps: "- - - - 2? - 1? 3?", step: 1/8, octave: 4, velocity: 0.5 }
  keys_a: { arp: pad_a, steps: "- 2? - 1 - 2? 3 -", step: 1/8, octave: 4, velocity: 0.5, swing: 0.08 }
  keys_b: { arp: pad_b, steps: "- 1? - 2 - 3? 2 -", step: 1/8, octave: 4, velocity: 0.5, swing: 0.08 }
  keys_lift: { arp: pad_lift, steps: "0 2 1 3 2 4 3 1'", step: 1/8, octave: 4, velocity: 0.6, swing: 0.08 }
  keys_resolved: { chords: "Ebadd9 | -", voicing: [G3, G4], velocity: 0.5, gate: 0.9 }
  keys_open: { chords: "Bbsus4 | -", voicing: [G3, G4], velocity: 0.5, gate: 0.9 }
  keys_minor: { chords: "Cm7 | -", voicing: [G3, G4], velocity: 0.45, gate: 0.9 }

  # Round bass, legato in 80–130 Hz, where small speakers still carry it: a gentle climb under a,
  # a slow walk down under b, and pushed eighths in the lift.
  bass_a: { notes: "Eb2 . . . . . F2 . | G2 . . . . . F2 . | Ab2 . . . . . G2 . | Bb2 . . . F2 . . .", step: 1/8, velocity: 0.75 }
  bass_b: { notes: "C3 . . . . . Bb2 . | Ab2 . . . . . Bb2 . | G2 . . . . . Ab2 . | F2 . . . Bb2 . . .", step: 1/8, velocity: 0.75 }
  bass_lift: { notes: "Ab2 . . . Ab2 . Eb2 . | Bb2 . . . Bb2 . F2 .", step: 1/8, velocity: 0.85 }
  bass_resolved: { notes: "Eb2 . . . . . . . | - - - - - - - -", step: 1/8, velocity: 0.75 }
  bass_open: { notes: "Bb2 . . . . . . . | - - - - - - - -", step: 1/8, velocity: 0.75 }
  bass_minor: { notes: "C2 . . . . . . . | - - - - - - - -", step: 1/8, velocity: 0.7 }

  # Felt kick and brushes at low density; the shaker sits above the voice. x hit, X accent, g ghost.
  kit_intro: { drums: { shaker: "........g...g..." }, step: 1/16, velocity: 0.5 }
  kit_a: { drums: { kick: "x.......x.......", snare: "....g.......g...", shaker: "..g...g...g...g." }, step: 1/16, velocity: 0.6, humanize: 0.08 }
  kit_b: { drums: { kick: "x.......x..x....", snare: "....x.......x...", shaker: "..g...g...g...g.", rim: "..............g." }, step: 1/16, velocity: 0.55, humanize: 0.08 }
  kit_lift: { drums: { kick: "x.......x.......", snare: "....X.......X...", shaker: "gxgxgxgxgxgxgxgx", hat: "x.g.x.g.x.g.x.g." }, step: 1/16, velocity: 0.62, humanize: 0.08 }
  kit_end: { drums: { kick: "x............... | ................" }, step: 1/16, velocity: 0.6 }

  # The lift's answer: a bell phrase and a bright pluck arpeggio, both high and brief.
  bell_lift: { notes: "- - - - Bb5 . . . | C6 . Bb5 . G5 . . .", step: 1/8, velocity: 0.62 }
  pluck_lift: { arp: pad_lift, steps: "0 - 2 - 4 - 1' -", step: 1/8, octave: 5, velocity: 0.45 }

sections:
  intro: { bars: 1, play: [pad_intro, keys_intro, kit_intro] }
  a: { bars: 4, play: [pad_a, keys_a, bass_a, kit_a] }
  b: { bars: 4, play: [pad_b, keys_b, bass_b, kit_b] }
  lift: { bars: 2, play: [pad_lift, keys_lift, bass_lift, kit_lift, bell_lift, pluck_lift], accent: true }
  resolved: { bars: 2, play: [pad_resolved, keys_resolved, bass_resolved, kit_end] }
  open: { bars: 2, play: [pad_open, keys_open, bass_open, kit_end] }
  minor: { bars: 2, play: [pad_minor, keys_minor, bass_minor, kit_end] }

form:
  intro: intro
  loop: [a, b]
  hero: lift
  ending: { looks-good: resolved, needs-attention: open, needs-changes: minor }
  logo: { track: bell, octave: 5, double: pluck }
