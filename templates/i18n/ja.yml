rule:
  async-foreach:
    checks: forEach に渡した async コールバック（await されない）
    title: '{path} で forEach に async コールバックを渡しています'
    explanation: 'forEach はコールバックが返す Promise を無視します。処理が終わる前にループが終わり、失敗は未処理の rejection になり、順序も保証されません。'
    suggestion: '逐次処理には `for (const x of items) await ...` を、並列処理には `await Promise.all(items.map(...))` を使ってください。'
  empty-catch:
    checks: 捕捉したまま黙って捨てられるエラー
    title: '{path} でエラーを黙って握りつぶしています'
    explanation: このブロックの失敗はログも復旧もなく消えます。バグが隠れ、障害の原因を追いにくくなります。
    suggestion: エラーを明示的に処理するか、ログに残すか、呼び出し元に伝えてください。意図的に無視するならコメントで理由を書いてください。
  error-handling-removed:
    checks: 代わりなしに削除されたエラー処理
    title: '{path} でエラー処理が削除されました'
    evidence: '{removed}を削除、{added} 行を追加。最初に削除された行: {line}（旧 {number} 行目）'
    lines: { other: 'エラー処理のコード {count} 行' }
    explanation: ここで処理していた失敗が、呼び出し元に伝わったり処理を止めたりする可能性があります。
    suggestion: 失敗のケースがまだどこかで処理されている（または起こりえなくなった）ことを確認してください。
  removed-export-still-referenced:
    checks: ほかのファイルがまだ使っている、削除または名前変更されたエクスポート
    title: '削除されたエクスポート {name} がまだ参照されています'
    evidence: "{name} は {path} から削除されましたが、{references}が残っています:\n{sample}"
    references: { other: '{count} か所の参照' }
    explanation: 削除されたシンボルをまだ import または呼び出しているコードは、コンパイルに失敗するか実行時に例外を投げます。
    suggestion: '残っている参照を更新するか、{name} を非推奨のエイリアスとして残してください。'
  route-removed:
    checks: 削除または名前変更された API ルート
    title: 'API ルート {route} が削除されました'
    evidence: '{file} から {route} のルート定義がなくなりました。'
    explanation: このルートを呼んでいる既存のクライアント、連携、キャッシュされたフロントエンドがエラーを受け取り始めます。
    suggestion: 依存するクライアントがないことを確認するか、非推奨期間を設けて残してください。
  destructive-migration:
    checks: 破壊的なスキーマ・データのマイグレーション
    title: '{file} の破壊的なマイグレーション'
    explanation: '{operations}はバックアップなしでは元に戻せず、デプロイ中に前のバージョンを動かしているコードが壊れる可能性があります。'
    suggestion: expand/contract の手順で展開し（先に列を使わないようにしてから、後のリリースで削除する）、バックアップを確認してください。
  schema-without-migration:
    checks: マイグレーションのない ORM スキーマの変更
    title: 'マイグレーションなしで{kind}が変更されています'
    prisma: Prisma スキーマ
    django: Django モデル
    evidence: '{path} はモデルのフィールドを変えていますが、この変更にマイグレーションファイルは追加されていません。'
    explanation: デプロイ済みのデータベースは古いスキーマのままなので、新しいフィールドを使うクエリが実行時に失敗します。
    suggestion: スキーマの変更と一緒にマイグレーションを生成してコミットしてください。
  img-missing-alt:
    checks: 代替テキストのない画像
    title: '{path} に代替テキスト（alt）のない画像があります'
    explanation: スクリーンリーダーは alt のない画像をファイル名で読み上げるか読み飛ばすため、画像の意味が伝わりません。
    suggestion: 画像を説明する alt="…" を付けるか、装飾だけなら alt="" にしてください。
  focus-outline-removed:
    checks: 見える代わりのないまま消されたフォーカス表示
    title: '{path} でフォーカスのアウトラインを消しています'
    explanation: 'キーボードの利用者はフォーカスのアウトラインで現在位置を確認します。:focus-visible の代わりなしに消すと、マウスなしでは使いにくくなります。'
    suggestion: '見えるフォーカススタイルを残してください。例: `:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }`。'
  click-on-static-element:
    checks: キーボード操作に対応していない非インタラクティブ要素のクリックハンドラー
    title: '{path} のクリックできる <{tag}> はキーボードで操作できません'
    explanation: 'クリックハンドラーだけの <{tag}> は Tab で移動できず Enter/Space でも実行できません。スクリーンリーダーもコントロールとして読み上げません。'
    suggestion: '<button> を使ってください（または role="button"、tabIndex={0}、キーハンドラーを追加してください）。'
  secret-in-diff:
    checks: リポジトリに追加された認証情報や秘密鍵
    title: '{path} に {label} がコミットされています'
    evidence: '追加された行に {label} の形式に一致する値があります: {value}'
    explanation: コミットした内容はリポジトリにアクセスできる全員が読めて、削除しても git の履歴に残ります。
    suggestion: 今すぐ認証情報を無効にしてローテーションし、シークレットストアか環境変数から読み込んでください。
    label:
      private-key: 秘密鍵
  merge-conflict-markers:
    checks: 残っているマージコンフリクトのマーカー
    title: '{path} に未解決のマージコンフリクトがあります'
    evidence: '追加されたコンフリクトマーカー: {line}'
    explanation: ファイルにコンフリクトの両側が入っているため、パースできないか意図どおりに動きません。
    suggestion: 'コンフリクトを解決し、<<<<<<< / ======= / >>>>>>> のマーカーを消してください。'
  focused-test:
    checks: スイートの残りを黙ってスキップさせるフォーカスしたテスト（.only）
    title: '{path} にフォーカスしたテスト（.only）が残っています'
    explanation: フォーカスしたテストがあると同じ範囲のほかのテストがすべてスキップされるため、それらを実行しないまま CI が通ることがあります。
    suggestion: マージする前に `.only` を消してください。
  skipped-test:
    checks: 新しくスキップまたは無効化されたテスト
    title: '{path} のテストがスキップされています'
    titleMany: '{count} 件のテストがスキップされています'
    explanation: スキップしたテストは、それが守っていた動作をもう守りません。意図的なこともありますが、慎重に決めるべきです。
    suggestion: スキップが意図どおりか確認し、再び有効にするまで追跡してください。
  debug-leftover:
    checks: アプリケーションコードに残った debugger 文やブレークポイント
    title: '{path} にデバッガーのブレークポイントが残っています'
    explanation: ブレークポイントは開発者ツールやデバッガーがつながると実行を止めます。リリースする意図で入れることはまずありません。
    suggestion: ブレークポイントを削除してください。
  lockfile-out-of-sync:
    checks: ロックファイルなしで変更された依存関係のマニフェスト
    title: '{manifest} は変更されていますが {lockfile} は変更されていません'
    evidence: '依存関係が変わっています（{dependencies}）が、{lockfile} は更新されていません。'
    explanation: 再現可能なインストール（npm ci、cargo build --locked など）が失敗するか、テストしたものと違うバージョンが入ります。
    suggestion: 'パッケージマネージャーでインストールを実行し、更新された {lockfile} をコミットしてください。'
  major-dependency-upgrade:
    checks: 依存関係のメジャーバージョンアップ
    title: '{name} のメジャーアップグレード'
    titleMany: '依存関係のメジャーアップグレード {count} 件'
    explanation: メジャーバージョンは、ライブラリが互換性を壊す変更を入れるところです。コンパイルが通っても動作が変わることがあります。
    suggestion: このプロジェクトでのパッケージの使い方に影響する互換性のない変更がないか、リリースノートに目を通してください。
  env-var-undocumented:
    checks: 環境変数のサンプルファイルにない新しい環境変数
    title: '新しい環境変数 {name} が記載されていません'
    titleMany: '新しい環境変数 {count} 個が記載されていません'
    evidence:
      other: 'コードは {names} を読んでいますが、{file} にはありません。'
    explanation: デプロイ担当者やチームメイトは、何を設定するかをサンプルファイルで知ります。記載のない変数はたいてい実行時のエラーとして表に出ます。
    suggestion:
      other: '安全なプレースホルダーの値と一緒に {file} に追加してください。'
  missing-tests:
    checks: テストを伴わない動作の変更
    titleBugFix: リグレッションテストのないバグ修正
    title: テストのない動作の変更
    evidence: '{files}が変更され（追加 {lines} 行）、テストファイルは変更されていません: {list}。'
    sourceFiles: { other: 'ソースファイル {count} 個' }
    explanationBugFix: 修正前に失敗するテストがないと、バグが気づかれないまま戻ってくることがあります。
    explanation: テストのない新しい動作は、後の変更で簡単に壊れます。
    suggestionBugFix: 元のバグを再現するテストを追加してください。
    suggestion: 新しい動作の主な経路のテストを追加してください。
  intent-mismatch:
    checks: 説明された意図と実際の変更の食い違い
    title: '{kind}と説明された変更が動作を変えています'
    explanation: レビュアーは説明を見て、どれだけ丁寧に読むかを決めます。知らされていない動作の変更は見落とされがちです。
    suggestion: 動作の変更が意図どおりか確認し、説明に書いてください。
  dangerous-html:
    checks: 生の HTML を差し込む箇所（innerHTML、dangerouslySetInnerHTML、v-html）
    title: '{path} でサニタイズしていない HTML を描画しています'
    explanation: '{api} の部分がマークアップを HTML として描画します。一部でもユーザーや外部のデータに由来するなら、クロスサイトスクリプティング（XSS）の入口になります。'
    suggestion: HTML ではなくテキストとして描画するか、差し込む前にマークアップをサニタイズしてください（たとえば DOMPurify で）。
  dynamic-code-execution:
    checks: eval や動的に組み立てたコード
    title: '{path} で動的にコードを実行しています'
    explanation: 文字列をコードとして実行すると、そこに届いたものが何でも実行され、静的解析も効かなくなります。必要な場面もまれです。
    suggestion: 明示的なパースか、ルックアップテーブルに置き換えてください。
  sql-string-building:
    checks: パラメーターではなく文字列の埋め込みで組み立てた SQL
    title: '{path} で埋め込んだ値から SQL を組み立てています'
    explanation: 値を SQL の文字列に埋め込むと、どれか一つでもユーザーが影響を与えられる場合に SQL インジェクションが可能になります。
    suggestion: パラメーター化クエリ（プレースホルダーとバインドした値）を使ってください。
  workflow-script-injection:
    checks: 信頼できないイベントのデータを埋め込む GitHub Actions のスクリプト
    title: '{path} で {expression} を通じたスクリプトインジェクション'
    explanation: '{expression} は攻撃者が制御できる値で、実行前にシェルスクリプトにそのまま埋め込まれます。細工したタイトルやブランチ名でワークフロー内のコマンドを実行できてしまいます。'
    suggestion: '値は環境変数で渡し（env: TITLE: ${{ ... }}）、スクリプトでは "$TITLE" で参照してください。'
  workflow-pull-request-target:
    checks: 信頼できない PR のコードをチェックアウトする pull_request_target ワークフロー
    title: '{path} の pull_request_target ワークフローが PR のコードをチェックアウトしています'
    explanation: pull_request_target は書き込みトークンとリポジトリのシークレットを持って実行されます。PR のコードをチェックアウトして実行すると、どのフォークでもその権限でコードを実行できます。
    suggestion: PR のコードを実行するジョブには pull_request トリガーを使い、コメント投稿のような権限が必要なステップは、PR のコードをチェックアウトしない別の workflow_run ジョブに分けてください。
  workflow-broad-permissions:
    checks: write-all に広げたワークフローのトークン権限
    title: '{path} のワークフローが write-all のトークン権限を与えています'
    explanation: サードパーティのアクションを含むすべてのステップが、コードの push、リリースの編集、設定の変更ができるトークンを受け取ります。
    suggestion: 'ジョブに必要なスコープだけを与えてください（例: contents: read、pull-requests: write）。'

capture:
  trustHint: '`covi trust` で確認して許可してください。'
  skip:
    appStart: 'app.start（{command}）'
    command: 'コマンド "{name}"'
    demonstration: デモ
    pagesFlowsRequests: ページ、フロー、リクエスト
    appAt: '{revision} リビジョンのアプリ'
    flow: 'フロー "{name}"'
  reason:
    notTrusted: 'このマシンではまだ信頼されていません。{hint}'
    appNotTrusted: 'リポジトリの設定にあるアプリの設定は、このマシンではまだ信頼されていません。{hint}'
    cannotRun: 'Covi はこのプロジェクトの実行方法を知りません。.covi/config.yml に app.start（必要なら app.url も）か app.static を設定してください{example}。'
    example: '（例: {suggestion}）'
    nothing: デモで見せるものはありません。
  finding:
    appStart:
      title: head リビジョンでアプリが起動しません
      explanation: この変更を適用すると、設定されたアプリを起動できません。起動処理かビルドが壊れている可能性が高いです。
    flow:
      title: 'head リビジョンでフロー "{name}" が失敗します'
      explanation: この変更を適用すると、設定されたユーザーフローを最後まで進められません。
    pageError:
      title: '{path} で新しい JavaScript エラーが出ます'
      explanation: '{path}（{viewport}）を読み込むと、base リビジョンでは出なかったエラーが head リビジョンでログに出ます。'
    pageStatus:
      title: '変更後に {path} が HTTP {status} を返します'
      evidence: 'base: HTTP {base}、head: HTTP {head}。'
      explanation: base リビジョンではページが開けますが、この変更を適用すると失敗します。
    apiShape:
      title: '{method} {path} のレスポンスの形が変わりました'
      evidence: '両方のリビジョンで {method} {path} を呼び出して確認しました: {shape}。'
      explanation: 以前の形をパースしている既存のクライアントは、同じリリースで更新しないと壊れます。
      suggestion: エンドポイントにバージョンを付けるか、以前の形をパラメーターで残すか、この変更ですべてのクライアントを更新してください。
    apiStatus:
      title: '{method} {path} が HTTP {status} で失敗するようになりました'
      evidence: 'base: HTTP {base}、head: HTTP {head}。{body}'
      explanation: この変更の前は動いていたエンドポイントが、サーバーエラーを返すようになりました。
    command:
      title: '`{command}` が失敗するようになりました'
      evidence: "base の終了コードは {base}、head の終了コードは {head}。\n{output}"
      explanation: デモのコマンドは、この変更がなければ成功し、変更を適用すると失敗します。
      timeout: タイムアウト
  shape:
    kindChanged: 'レスポンスが JSON の{from}から JSON の{to}に変わりました{keys}'
    keys: '（キー: {keys}）'
    removed: { other: 'フィールド {fields} を削除' }
    retyped: '{fields} の型を変更'
    retypedField: '{path}（{from} → {to}）'
    value: 値
    response: 'レスポンスの変更: {parts}'
    and: 'と'
    kind:
      array: 配列
      object: オブジェクト
      string: 文字列
      number: 数値
      boolean: 真偽値
      'null': 'null'
      unknown: 不明
      bigint: bigint
      undefined: undefined
      function: 関数
      symbol: シンボル

