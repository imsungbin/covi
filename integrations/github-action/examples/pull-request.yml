# Review every pull request with Covi.
# Works for branches and forks: fork pull requests get a read-only token, so Covi still reviews,
# annotates, and uploads artifacts, and skips the comment (see fork-safe-comment.yml to post it).
name: Covi

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write   # only needed for the summary comment

concurrency:
  group: covi-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Covi diffs against the merge base

      - uses: your-org/covi/integrations/github-action@v1   # replace your-org with where Covi lives
        with:
          fail-on: high          # fail on confirmed/likely high-severity findings
          video: auto            # a video only when the change is worth seeing
          video-mode: short
          duration: 30s
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: model-written review
