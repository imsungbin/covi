# Covi's fixed strings in English. Every key here exists in ko.yml, ja.yml, and zh.yml with the
# same placeholders (a test checks it). A message is text with {placeholders}, or a plural map
# (one, other, …) chosen by {count}. See packages/core/src/i18n/catalog.ts.

# Language names, as this language writes them.
languageName:
  en: English
  ko: Korean
  ja: Japanese
  zh: Simplified Chinese

# Names of change areas Covi groups files into.
area:
  root: project root
  github: GitHub configuration
  other: other files

verdict:
  looks-good: Looks good
  needs-attention: Needs attention
  needs-changes: Needs changes

certainty:
  confirmed: Confirmed issue
  likely: Likely issue
  risk: Risk worth checking
  question: Question

# Counts in review summaries: "2 likely issues, 1 question".
certaintyCount:
  confirmed: { one: '{count} confirmed issue', other: '{count} confirmed issues' }
  likely: { one: '{count} likely issue', other: '{count} likely issues' }
  risk: { one: '{count} risk worth checking', other: '{count} risks worth checking' }
  question: { one: '{count} question', other: '{count} questions' }

severity:
  high: high
  medium: medium
  low: low

confidence:
  high: high
  medium: medium
  low: low

category:
  correctness: correctness
  regression: regression
  edge-case: edge-case
  error-handling: error-handling
  state: state
  concurrency: concurrency
  security: security
  permissions: permissions
  api-compatibility: api-compatibility
  data-integrity: data-integrity
  performance: performance
  accessibility: accessibility
  testing: testing
  ui: ui
  maintainability: maintainability
  complexity: complexity
  intent-mismatch: intent-mismatch
  dependency: dependency
  configuration: configuration

